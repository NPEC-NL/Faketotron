<style>\r
  :root{--bg:#eef1f3;--panel:#fff;--bar:#cfd9eb;--field:#c6e6ee;--ink:#222;--b:#9aa5b1;--bd:#6b7a8a;--accent:#6e8fb5;--rule:#bac6d9}\r
  html,body{height:100%}\r
  body{margin:0;background:var(--bg);color:var(--ink);font:14px "Segoe UI",Tahoma,Arial,sans-serif;width:1200px;height:800px;overflow:hidden}\r
  .tabs{height:48px;display:flex;align-items:flex-end;gap:8px;padding:0 8px}\r
  .tab{height:36px;padding:0 18px;border:1px solid var(--b);border-bottom:none;border-radius:4px 4px 0 0;background:#f6f7f9;display:flex;align-items:center}\r
  .tab.active{background:#fff;font-weight:600}\r
  .row{display:flex;gap:12px;padding:0 12px 12px;height:calc(100% - 48px)}\r
  .left{width:800px;background:var(--panel);border:1px solid var(--b);display:flex;flex-direction:column}\r
  .right{width:360px;margin-left:auto;background:var(--panel);border:1px solid var(--b);display:flex;flex-direction:column}\r
  .toolbar{height:auto;min-height:44px;background:var(--bar);border-bottom:1px solid var(--b);display:flex;flex-wrap:wrap;align-items:center;padding:6px 10px;gap:12px;justify-content:flex-end;}\r
  .toolbar-row{width:100%;display:flex;gap:8px;justify-content:flex-end;margin-top:4px}\r
  .toolbar .btn:first-child {margin-right:180px;min-width:120px;}\r
  .toolbar-row .btn:first-child {margin-right:0px;min-width:120px;}\r
  .btn{min-width:85px;height:28px;border:1px solid var(--b);background:linear-gradient(#fff,#e6e9ee);border-radius:4px;cursor:pointer}\r
  .btn.small{min-width:75px;height:24px}\r
  .btn:disabled{opacity:.5;cursor:not-allowed}\r
  .label{font-weight:600}\r
  .field{height:28px;min-width:140px;border:1px solid var(--bd);background:var(--field);border-radius:3px;text-align:center;line-height:28px;padding:0 8px}\r
  .group-tabs{height:30px;display:flex;align-items:center;gap:3px;padding:6px 8px;background:#f3f3f3;border-bottom:1px solid var(--b);flex-wrap:wrap}\r
  .gtab{padding:4px 8px;border:1px solid var(--b);border-radius:4px;background:#eee;font-size:12px;cursor:pointer}\r
  .gtab.active{background:#fff;border-color:var(--accent)}\r
  .workspace{flex:1;background:#e6e6e6;margin:8px;border:1px solid var(--b);overflow:auto}\r
\r
  .ph-list{background:#fff;border:1px solid var(--b)}\r
  .ph-row{display:grid;grid-template-columns:25px 60px 90px 120px 1fr 120px;align-items:center;border-bottom:1px solid #dde2ea;padding:8px 10px;min-height:48px}\r
  .ph-row.tall{min-height:110px}\r
  .ph-row.header{background:#f2f5f9;font-weight:600}\r
  .ph-row.header div:last-child {padding-left: 50%};\r
  .ph-row.dragging{opacity:.6}\r
  .ph-actions{display:flex;flex-direction:column;gap:6px;justify-content:center;align-items:flex-end}\r
  .pill{display:inline-block;background:#eaf3ff;border:1px solid #8aa4c2;padding:2px 6px;border-radius:4px;font-size:12px;margin-right:6px}\r
  .clickable{cursor:pointer}\r
\r
  .sum-grid{display:grid;grid-template-columns:repeat(4, auto);gap:6px 16px;align-items:center}\r
  .sum-grid .l{color:#475769}\r
  .sum-grid .v{background:#f3f7fb;border:1px solid #c9d3e6;border-radius:3px;padding:2px 6px}\r
\r
  .right-head{padding:10px}\r
  .select{width:100%;height:30px;border:1px solid var(--b);border-radius:4px}\r
  .section{padding:8px 10px 4px}\r
  .rule{height:1px;background:var(--rule);margin:8px 0 12px}\r
  .section h5{margin:0;font-weight:600;color:#37455a}\r
  .file-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 10px 8px}\r
  .file-row .btn{min-width:unset;width:100%}\r
  .prop{display:grid;grid-template-columns:110px 1fr auto;align-items:center;padding:6px 10px}\r
  .prop .input{max-width: 110px;}\r
  .input, textarea{border:1px solid var(--bd);background:var(--field);border-radius:3px;padding:6px}\r
  textarea{height:90px;resize:none}\r
  .ro{background:#e9eef2;text-align:center;max-width:none !important;}\r
  .instruction{margin-top:auto;border-top:1px solid var(--b);padding:10px;font-size:20px;color:#556;background:#f7f8fb}\r
\r
  .overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45)}\r
  .modal{width:760px;background:#4a5f73;padding:22px;border-radius:6px;box-shadow:0 8px 20px rgba(0,0,0,.35)}\r
  .modal-title{color:#fff;font-weight:600;text-align:center;margin:0 0 10px}\r
  .modal-inner{background:#f2f2f2;border:1px solid var(--bd);padding:14px}\r
  .vm-body{display:grid;grid-template-columns:1fr 140px;gap:10px}\r
  .vg-tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}\r
  .vg-tab{padding:6px 10px;border:1px solid var(--b);background:#e7ebef;border-radius:4px;font-size:12px;cursor:pointer}\r
  .vg-tab.active{background:#fff;border-color:var(--accent)}\r
  .vg-col{background:#fff;border:1px solid var(--b);padding:8px;max-height:260px;overflow:auto}\r
  .pill-row{display:flex;align-items:center;gap:6px;margin:4px 0}\r
  .mini{min-width:70px;height:24px}\r
  .side-actions{display:flex;flex-direction:column;gap:8px}\r
  .footer-line{display:flex;justify-content:space-between;color:#555;font-size:12px;margin-top:6px}\r
  .sub{width:680px}\r
  .sub-wide{width:820px}\r
  .sub-inner{background:#d6dee6;border:1px solid var(--bd);padding:16px;border-radius:6px}\r
  .listbox{background:#f7f9fb;border:1px solid var(--b);max-height:360px;overflow:auto;padding:10px}\r
  .grid2{display:grid;grid-template-columns:160px 1fr;gap:8px;align-items:center}\r
</style>\r
</head>\r

}\r
// Build TAB_ORDER as group-name order\r
function buildTabOrderFromParts(parts){ return parts.map(p=>p["group-name"]); }\r

// Update RANGES for a profile; default to BASE, but ensure each group has a sensible range\r
function buildRangesForProfile(profileName, parts){\r
  const base = BASE_CONSTS.RANGES;\r
  const out = {};\r
  // start by cloning base known keys\r
  for(const k in base){ out[k] = JSON.parse(JSON.stringify(base[k])); }\r
  // ensure each part has a range; default 0–100 int for light-like groups\r
  parts.forEach(p=>{\r
    const name = p["group-name"];\r
    if(!out[name]){\r
      out[name] = {min:0,max:100,int:true};\r
    }\r
  });\r
  // Special: Daylight new channels (Amber, Blue, Cyan, Green, Red, UVA) -> 0–100 percent\r
  if(profileName==='Daylight'){\r
    ['Amber','Blue','Cyan','Green','Red','UVA'].forEach(n=>{\r
      out[n] = {min:0,max:100,int:true};\r
    });\r
  }\r
  // Special: Helios growth custom limits\r
  if(profileName==='Helios growth'){\r
    if(out['CO2']){ out['CO2'].min = 0; out['CO2'].max = 1500; }\r
    if(out['Humidity']){ out['Humidity'].min = 40; out['Humidity'].max = 90; }\r
    if(out['Temperature']){ out['Temperature'].min = 10; out['Temperature'].max = 40; out['Temperature'].scale = 10; out['Temperature'].int = true; }\r
  }\r
\r
  return out;\r
}\r

// Build DEF from BASE and optional overrides present in profile JSON parts[].phases\r
function buildDefForProfile(parts){\r
  // clone deep\r
  const def = JSON.parse(JSON.stringify(BASE_CONSTS.DEF));\r
  parts.forEach(p=>{\r
    const name = p["group-name"];\r
    const phases = p.phases || [];\r
    if(phases.length===0) return;\r
    // For each phase type present, set that as default for this group\r
    phases.forEach(ph=>{\r
      if(!ph || !ph.type) return;\r
      const typ = (ph.type==='clouds') ? 'cloud' : ph.type;\r
      if(!def[typ]) def[typ] = {};\r
      if(typ==='ramp'){\r
        def.ramp[name] = { start:ph.start, end:ph.end, duration:ph.duration||'01:00:00' };\r
      }else if(typ==='sin'){\r
        def.sin[name] = { min:ph.min, max:ph.max, period:ph.period, phaseOffset:ph.phaseOffset, duration:ph.duration||'01:00:00' };\r
      }else if(typ==='cloud'){\r
        def.cloud[name] = {\r
          amplitude:ph.amplitude, offset:ph.offset,\r
          cloud_density:ph.cloud_density, cloud_position:ph.cloud_position,\r
          cloud_duration_mean:ph.cloud_duration_mean, cloud_duration_var:ph.cloud_duration_var,\r
          fluctuation_mean_ratio: (Math.round((ph.fluctuation_mean_ratio)*100)/100), fluctuation_var:ph.fluctuation_var,\r
          cloud_drop_coeff: (Math.round((ph.cloud_drop_coeff)*100)/100), duration:ph.duration||'01:00:00'\r
        };\r
      }else if(typ==='const'){\r
        def.const[name] = { value:ph.value, duration:ph.duration||'01:00:00' };\r
      }\r
    });\r
  });\r
  return def;\r
}\r

// Apply a profile by mutating the existing constant maps\r
function applyProfile(name){\r
  const prof = PROFILE_JSONS[name];\r
  ACTIVE_PROFILE = name;\r
  if(!prof){ // Fytotron\r
    // restore base consts\r
    TAB_ORDER.length = 0; Array.prototype.push.apply(TAB_ORDER, BASE_CONSTS.TAB_ORDER);\r
    assignObject(INVENTORY, BASE_CONSTS.INVENTORY);\r
    assignObject(MACHINE_VAR, BASE_CONSTS.MACHINE_VAR);\r
    assignObject(TYPE_UNIT, BASE_CONSTS.TYPE_UNIT);\r
    assignObject(RANGES, BASE_CONSTS.RANGES);\r
    assignObject(DEF, BASE_CONSTS.DEF);\r
  }else{\r
    const parts = (prof.sections && prof.sections[0] && prof.sections[0].parts) ? prof.sections[0].parts : [];\r
    // TAB_ORDER\r
    TAB_ORDER.length = 0; Array.prototype.push.apply(TAB_ORDER, buildTabOrderFromParts(parts));\r
    // INVENTORY & MACHINE_VAR\r
    const iv = buildInventoryAndMachineVar(parts);\r
    assignObject(INVENTORY, iv.INV);\r
    assignObject(MACHINE_VAR, iv.MV);\r
    // TYPE_UNIT\r
    assignObject(TYPE_UNIT, buildTypeUnitFromParts(parts));\r
    // RANGES (merge)\r
    assignObject(RANGES, buildRangesForProfile(name, parts));\r
    // DEF (override per provided phases)\r
    assignObject(DEF, buildDefForProfile(parts));\r
  }\r
  // Rebuild inverse map used by loader\r
  window.INV_MACHINE_VAR = invertMachineVarMap();\r
  // Reset protocol/groups\r
  protocol = {description:"",repeat:2147483647,logic:"",sections:[{parts:[]}]};\r
  createDefaultGroups();\r
  // rebuild unassigned pool (everything unassigned initially)\r
  unassigned = {};\r
  TAB_ORDER.forEach(t=>{ unassigned[t] = []; });\r

}\r

function isHHMMSSClock(v){\r
  const m=/^(\\d{2}):(\\d{2}):(\\d{2})$/.exec(v||'');\r
  if(!m) return false;\r
  const H=+m[1], M=+m[2], S=+m[3];\r
  return H>=0 && H<24 && M>=0 && M<60 && S>=0 && S<60;\r
}\r
// Accept either D.HH:MM:SS (HH=00-23) or H+:MM:SS (unbounded hours) for user/file inputs\r
function isDHHMMSS(v){\r
  const m=/^(\\d+)\\.(\\d{2}):(\\d{2}):(\\d{2})$/.exec(v||'');\r
  if(!m) return false;\r
  const D=+m[1], H=+m[2], M=+m[3], S=+m[4];\r
  return D>=0 && H>=0 && H<24 && M>=0 && M<60 && S>=0 && S<60;\r
}\r
function isHPlus(v){\r
  const m=/^(\\d+):(\\d{2}):(\\d{2})$/.exec(v||'');\r
  if(!m) return false;\r
  const H=+m[1], M=+m[2], S=+m[3];\r
  return H>=0 && M>=0 && M<60 && S>=0 && S<60;\r
}\r
function isDuration(v){ return isDHHMMSS(v) || isHPlus(v); }\r
// Parse either format to seconds\r
function durationToSeconds(s){\r
  if(isDHHMMSS(s)){\r
    const m=/^(\\d+)\\.(\\d{2}):(\\d{2}):(\\d{2})$/.exec(s);\r
    const D=+m[1], H=+m[2], M=+m[3], S=+m[4];\r
    return D*86400 + H*3600 + M*60 + S;\r
  }\r
  if(isHPlus(s)){\r
    const m=/^(\\d+):(\\d{2}):(\\d{2})$/.exec(s);\r
    const H=+m[1], M=+m[2], S=+m[3];\r
    return H*3600 + M*60 + S;\r
  }\r
  return NaN;\r
}\r
function durationToHours(s){ const sec=durationToSeconds(s); return Number.isFinite(sec)? sec/3600 : 0; }\r
// Format seconds to display rule: <24h -> HH:MM:SS; >=24h -> D.HH:MM:SS\r
function secondsToDisplayDuration(sec){\r
  sec = Math.max(0, Math.floor(sec||0));\r
  const SS = (n)=> String(n).padStart(2,'0');\r
  const days = Math.floor(sec/86400);\r
  let rem = sec % 86400;\r
  const h = Math.floor(rem/3600);\r
  rem %= 3600;\r
  const m = Math.floor(rem/60);\r
  const s = rem % 60;\r
  if(days>0){\r
    return \`\${days}.\${SS(h)}:\${SS(m)}:\${SS(s)}\`;\r
  }else{\r
    return \`\${SS(h)}:\${SS(m)}:\${SS(s)}\`;\r
  }\r
}\r
// Normalize an input duration string into the display rule, or return null if invalid\r
function normalizeDurationStr(str){\r
  const sec = durationToSeconds(str);\r
  if(!Number.isFinite(sec)) return null;\r
  return secondsToDisplayDuration(sec);\r
}\r

function readPhaseFromForm(varType){\r

  const clampCheck=(raw,min,max,{requireInt=true}={})=>{\r
    const n=asNumber(raw);\r
    if(!Number.isFinite(n)) return {ok:false,msg:'Not a number'};\r
    if(requireInt && !Number.isInteger(n)) return {ok:false,msg:'Must be an integer'};\r
    if(n<min||n>max) return {ok:false,msg:\`Out of range (\${min}-\${max})\`};\r
    return {ok:true,val:n};\r
  };\r
  const durRaw=$('#phDur').value||'01:00:00';\r

\r
\r
  if(t==='const'){\r

    let eC=clampCheck($('#phEnd').value,rng.min,rng.max,{requireInt:!tempDecimalAllowed}); if(!eC.ok){alert('End: '+eC.msg);return null;}\r
    let s=sC.val,e=eC.val; if(tempDecimalAllowed&&rng.scale){s=Math.round(s*rng.scale);e=Math.round(e*rng.scale);} else if(rng.scale){s*=rng.scale;e*=rng.scale;}\r
    const step=(($('#phStep')?.value)||RAMP_STEP);\r
    return {type:'ramp',start:s,end:e,duration:dur,step:step};\r
  }else if(t==='sin'){\r
    let mnC=clampCheck($('#phMin').value,rng.min,rng.max,{requireInt:!tempDecimalAllowed}); if(!mnC.ok){alert('Min: '+mnC.msg);return null;}\r
    let mxC=clampCheck($('#phMax').value,rng.min,rng.max,{requireInt:!tempDecimalAllowed}); if(!mxC.ok){alert('Max: '+mxC.msg);return null;}\r
    const periodRaw=$('#phPeriod').value||'01:00:00'; const period=normalizeDurationStr(periodRaw); if(!period){alert('Period must be HH:MM:SS or D.HH:MM:SS');return null;}\r
    const offsetRaw=$('#phOffset').value||'00:00:00'; const offset=normalizeDurationStr(offsetRaw); if(!offset){alert('Phase Offset must be HH:MM:SS or D.HH:MM:SS');return null;}\r
    let mn=mnC.val,mx=mxC.val; if(tempDecimalAllowed&&rng.scale){mn=Math.round(mn*rng.scale);mx=Math.round(mx*rng.scale);} else if(rng.scale){mn*=rng.scale;mx*=rng.scale;}\r
    const step=(($('#phStep')?.value)||RAMP_STEP);\r
    // Order will be enforced in buildParts\r
    return {type:'sin',min:mn,max:mx,period:period,phaseOffset:offset,duration:dur,step:step};\r
  }else if(t==='cloud'){\r
    // Local override for humidity clouds\r
    const rngEff = (varType==='Humidity') ? {min:0,max:100,int:true,scale:rng.scale} : rng;\r
    const den=parseInt($('#phDen').value,10); if(!intInRange(den,0,100)){alert('Cloud density must be an integer 0-100');return null;}\r
    const pos=parseInt($('#phPos').value,10); if(!intInRange(pos,0,100)){alert('Cloud position must be an integer 0-100');return null;}\r
    let ampC=clampCheck($('#phAmp').value,rngEff.min,rngEff.max,{requireInt:!tempDecimalAllowed}); if(!ampC.ok){alert('Amplitude: '+ampC.msg);return null;}\r
    let offC=clampCheck($('#phOff').value,rngEff.min,rngEff.max,{requireInt:!tempDecimalAllowed}); if(!offC.ok){alert('Offset: '+offC.msg);return null;}\r
    let amp=ampC.val, off=offC.val; if(tempDecimalAllowed&&rngEff.scale){amp=Math.round(amp*rngEff.scale);off=Math.round(off*rngEff.scale);} else if(rngEff.scale){amp*=rngEff.scale;off*=rngEff.scale;}\r
    const cMean=Number($('#phCMean').value); if(!Number.isInteger(cMean)){alert('Cloud duration mean must be an integer');return null;};\r

    const fmr=Number($('#phFR').value); if(!Number.isFinite(fmr)){alert('Fluctuation mean ratio must be a number');return null;}; const __fmr_round= Math.round(fmr*100)/100; const fmr_rounded = __fmr_round;\r
    const fv=Number($('#phFV').value); if(!Number.isInteger(fv)){alert('Fluctuation var must be an integer');return null;};\r

function deepCopy(obj){ return JSON.parse(JSON.stringify(obj)); }\r
function getActiveGroup(){ return groups.find(x=>x.id===activeGroupId); }\r
\r
// Behavior when values are out-of-range: 'clamp' | 'reject' | 'warn'\r
let PASTE_VALIDATION_MODE = 'clamp';\r
\r
function clamp(n, lo, hi){ return Math.min(hi, Math.max(lo, n)); }\r
\r
function validatePhaseForTarget(varType, phase, mode='clamp'){\r
  const rng = RANGES[varType];\r
  if(!rng) return { ok:true, fixed: phase, issues: [] };\r
\r
  // humidity cloud exception (same as buildPhaseFields UI hint)\r
  const effRangeForCloud = (varType==='Humidity')\r
    ? { min: 0, max: 100, scale: rng.scale }   // amplitude/offset use 0–100 for humidity\r
    : rng;\r
\r
  const isTemp = (varType === 'Temperature');\r
  const mustInt = (k)=> !isTemp; // Temperature allows decimals in UI, stored ×10 here\r
\r
  const issues = [];\r
  const out = deepCopy(phase);\r
\r
  const handle = (key, lo, hi, requireInt=true, target='rng')=>{\r
    if(out[key] == null) return;\r
    let v = Number(out[key]);\r
    if(!Number.isFinite(v)){\r
      issues.push(\`\${key} not a number\`);\r
      if(mode==='reject') return false;\r
      return true; // leave as-is for warn\r
    }\r
    if(requireInt && !Number.isInteger(v)){\r
      issues.push(\`\${key} must be an integer\`);\r
      if(mode==='reject') return false;\r
      if(mode==='clamp'){ v = Math.round(v); }\r
    }\r
    if(v < lo || v > hi){\r
      if(mode==='reject'){ issues.push(\`\${key} \${v} out of [\${lo}, \${hi}]\`); return false; }\r
      if(mode==='clamp'){ const nv = clamp(v, lo, hi); issues.push(\`\${key} \${v} → \${nv}\`); v = nv; }\r
      if(mode==='warn'){ issues.push(\`\${key} \${v} outside [\${lo}, \${hi}]\`); }\r
    }\r
    out[key] = v;\r
    return true;\r
  };\r
\r
  const checkDur = (k)=>{\r
    if(out[k]==null) return true;\r
    const n = normalizeDurationStr(out[k]);\r
    if(!n){ issues.push(\`\${k} invalid duration\`); return mode!=='reject'; }\r
    out[k]=n; return true;\r
  };\r
\r
  // Validate per type\r
  if(out.type === 'const'){\r
    if(!handle('value', rng.min, rng.max, mustInt('value'))) return {ok:false, fixed: out, issues};\r
  }\r
  else if(out.type === 'ramp'){\r
    if(!checkDur('duration')) return {ok:false, fixed: out, issues};\r
    if(!handle('start', rng.min, rng.max, mustInt('start'))) return {ok:false, fixed: out, issues};\r
    if(!handle('end',   rng.min, rng.max, mustInt('end')))   return {ok:false, fixed: out, issues};\r
    // keep step as-is (fixed in UI)\r
  }\r
  else if(out.type === 'sin'){\r
    if(!checkDur('duration')) return {ok:false, fixed: out, issues};\r
    if(!checkDur('period'))   return {ok:false, fixed: out, issues};\r
    if(!checkDur('phaseOffset')) return {ok:false, fixed: out, issues};\r
    if(!handle('min', rng.min, rng.max, mustInt('min'))) return {ok:false, fixed: out, issues};\r
    if(!handle('max', rng.min, rng.max, mustInt('max'))) return {ok:false, fixed: out, issues};\r
    // swap if inverted\r
    if(Number(out.min) > Number(out.max)){\r
      if(mode==='reject'){ issues.push('min > max'); return {ok:false, fixed: out, issues}; }\r
      issues.push(\`swapped min/max \${out.min}/\${out.max}\`);\r
      const t = out.min; out.min = out.max; out.max = t;\r
    }\r
  }\r
  else if(out.type === 'cloud'){\r
    if(!checkDur('duration')) return {ok:false, fixed: out, issues};\r
    // fixed fields present in UI:\r
    // amplitude/offset against effRangeForCloud:\r
    if(!handle('amplitude', effRangeForCloud.min, effRangeForCloud.max, mustInt('amplitude'))) return {ok:false, fixed: out, issues};\r
    if(!handle('offset',    effRangeForCloud.min, effRangeForCloud.max, mustInt('offset')))    return {ok:false, fixed: out, issues};\r
    // density/position: 0–100 integers\r
    if(!handle('cloud_density', 0, 100, true))  return {ok:false, fixed: out, issues};\r
    if(!handle('cloud_position', 0, 100, true)) return {ok:false, fixed: out, issues};\r
    // integer mins/vars\r
    if(!handle('cloud_duration_mean', -1e9, 1e9, true)) return {ok:false, fixed: out, issues};\r
    if(!handle('cloud_duration_var',  -1e9, 1e9, true)) return {ok:false, fixed: out, issues};\r
    if(typeof out.fluctuation_mean_ratio !== 'undefined'){\r
      const fmr = Number(out.fluctuation_mean_ratio);\r
      if(!Number.isFinite(fmr)){\r
        issues.push('fluctuation_mean_ratio not a number'); if(mode==='reject') return {ok:false,fixed:out,issues};\r
      }else{\r
        // keep as-is; UI rounds to 2 decimals, but we won't force rounding here\r
        out.fluctuation_mean_ratio = Math.round(fmr*100)/100;\r
      }\r
    }\r
    if(typeof out.fluctuation_var !== 'undefined'){\r
      const fv = Number(out.fluctuation_var);\r
      if(!Number.isInteger(fv)){\r
        if(mode==='reject'){ issues.push('fluctuation_var must be an integer'); return {ok:false,fixed:out,issues}; }\r
        issues.push('fluctuation_var coerced to integer'); out.fluctuation_var = Math.round(fv);\r
      }\r
    }\r
    if(typeof out.cloud_drop_coeff !== 'undefined'){\r
      const cdc = Number(out.cloud_drop_coeff);\r
      if(!Number.isFinite(cdc)){\r
        issues.push('cloud_drop_coeff not a number'); if(mode==='reject') return {ok:false,fixed:out,issues};\r
      }else{\r
        out.cloud_drop_coeff = Math.round(cdc*100)/100;\r
      }\r
    }\r
  }\r
\r
  return { ok: (mode!=='reject') || issues.length===0, fixed: out, issues };\r
}\r
\r
function validateClipboardForTarget(varType, phases, mode='clamp'){\r
  const fixed = [];\r
  const issues = [];\r
  let allOk = true;\r
  phases.forEach((p, idx)=>{\r
    const { ok, fixed: fp, issues: is } = validatePhaseForTarget(varType, p, mode);\r
    if(is.length) is.forEach(m => issues.push(\`Phase \${idx+1}: \${m}\`));\r
    if(!ok) allOk = false;\r
    fixed.push(fp);\r
  });\r
  return { ok: allOk, fixed, issues };\r
}\r

function updatePhaseToolsState(){\r
  const g = getActiveGroup();\r
  const hasSel = selectedPhaseIdx.size > 0;\r
  $('#btnCopyPhases').disabled = !hasSel;\r
  $('#btnMoveSelUp').disabled  = !hasSel;\r
  $('#btnMoveSelDown').disabled= !hasSel;\r
  $('#btnPastePhases').disabled= !phaseClipboard || !g;\r
  // update header checkbox indeterminate state\r
  const sa = $('#phSelAll');\r
  if(sa && g){\r
    sa.checked = (g.phases.length>0 && selectedPhaseIdx.size === g.phases.length);\r
    sa.indeterminate = (selectedPhaseIdx.size>0 && selectedPhaseIdx.size < g.phases.length);\r
  }\r
}\r

function getSelectedBlocks(){\r
  const idxs = [...selectedPhaseIdx].sort((a,b)=>a-b);\r
  const blocks = [];\r
  for(let i=0;i<idxs.length;){\r
    const start = idxs[i];\r
    let end = start;\r
    i++;\r
    while(i<idxs.length && idxs[i]===end+1){ end = idxs[i]; i++; }\r
    blocks.push({start,end});\r
  }\r
  return blocks;\r
}\r

$('#btnCopyPhases').onclick = ()=>{\r
  const g = getActiveGroup(); if(!g){return;}\r
  if(selectedPhaseIdx.size===0){ alert('Select at least one phase.'); return; }\r
  const ordered = [...selectedPhaseIdx].sort((a,b)=>a-b).map(i=>deepCopy(g.phases[i]));\r
  phaseClipboard = ordered;\r
  updatePhaseToolsState();\r
};\r
\r
$('#btnPastePhases').onclick = ()=>{\r
  const g = getActiveGroup(); if(!g || !phaseClipboard || phaseClipboard.length===0){ return; }\r
  const varType = g.type; // e.g., "CO2", "Cool White", "Temperature", "Amber" (Daylight), etc.\r
\r
  // Validate against CURRENT profile limits (RANGES is rebuilt on applyProfile)\r
  const { ok, fixed, issues } = validateClipboardForTarget(varType, phaseClipboard, PASTE_VALIDATION_MODE);\r
\r
  if(PASTE_VALIDATION_MODE === 'reject' && !ok){\r
    alert('Paste aborted:\\n\\n' + issues.join('\\n'));\r
    return;\r
  }\r
  if(issues.length){\r
    alert(\r
      (PASTE_VALIDATION_MODE==='clamp' ? 'Pasted with corrections:' :\r
       PASTE_VALIDATION_MODE==='warn'  ? 'Pasted with warnings:'    : 'Issues:') +\r
      '\\n\\n' + issues.join('\\n')\r
    );\r
  }\r
\r
  const after = (selectedPhaseIdx.size>0) ? Math.max(...selectedPhaseIdx) : (g.phases.length-1);\r
  const at = Math.max(0, after+1);\r
  const clones = deepCopy(fixed);\r
  g.phases.splice(at, 0, ...clones);\r
\r
  clearSelection();\r
  for(let k=0; k<clones.length; k++){ selectedPhaseIdx.add(at+k); }\r
  renderPhases(); updateGroupDurationField(); updateOverallDuration();\r
};\r
\r
\r
$('#btnMoveSelUp').onclick = ()=>{\r
  const g = getActiveGroup(); if(!g) return;\r
  if(selectedPhaseIdx.size===0) return;\r
\r
  const blocks = getSelectedBlocks();\r
  // Move each block up by one, left-to-right to avoid index interference\r
  blocks.forEach(({start,end})=>{\r
    if(start===0) return; // can't move past top\r
    const before = g.phases.splice(start-1,1)[0]; // remove item before the block\r
    g.phases.splice(end,0,before);                // insert it after the block\r
  });\r
\r
  // Remap selection: only moved blocks shift -1\r
  const next = new Set(selectedPhaseIdx);\r
  blocks.forEach(({start,end})=>{\r
    if(start===0) return;\r
    for(let i=start;i<=end;i++) next.delete(i);\r
    for(let i=start-1;i<=end-1;i++) next.add(i);\r
  });\r
  selectedPhaseIdx = next;\r
\r
  renderPhases(); updateGroupDurationField(); updateOverallDuration();\r
};\r
\r
\r
$('#btnMoveSelDown').onclick = ()=>{\r
  const g = getActiveGroup(); if(!g) return;\r
  if(selectedPhaseIdx.size===0) return;\r
\r
  const blocks = getSelectedBlocks();\r
  // Process right-to-left so later blocks don't disturb earlier indices\r
  for(let b=blocks.length-1; b>=0; b--){\r

  // Remap selection: only moved blocks shift +1\r
  const next = new Set(selectedPhaseIdx);\r
  blocks.forEach(({start,end})=>{\r
    if(end===g.phases.length-1) return;\r
    for(let i=start;i<=end;i++) next.delete(i);\r
    for(let i=start+1;i<=end+1;i++) next.add(i);\r

/* ============================================================\r
   EXPORT: JSON & FYT\r
   ============================================================ */\r
\r
/*\r
 * IMPORTANT — FYT header calculation (verified against machine files):\r
 *\r
 * Header bytes at positions 22–23 are derived ONLY\r
 * from the header+JSON length (the trailer is excluded).\r
 *\r
 * Let H = 24 (fixed header length).\r
 * Let J = length of the JSON bytes (must use CRLF line endings, no trailing CRLF).\r
 * Let T = H + J + 104.\r
 * Let q = floor(T / 128).\r
 * hi = q - 1\r
 * lo = (T % 128) + 128\r
 * Stored header bytes = [lo, hi]  (little-endian order).\r
 *\r
 * JSON serialization rules:\r
 * - "description" inside the JSON must always be "".\r
 * - Line endings are CRLF.\r
 * - No extra newline at the end.\r
 *\r
 * Trailer format (always present, even if empty):\r
 * - [ULEB128(description_length)] + [UTF-8 description bytes].\r
 * - If description is empty, this encodes as a single 0x00 byte.\r
 *\r
 * Final file layout:\r
 *   [24-byte fixed header with bytes 22–23 filled by formula]\r
 *   [JSON bytes]\r
 *   [Trailer]\r
 */\r
\r
// 22-byte fixed header prefix; bytes 22.. are dynamic per file length\r
const FIXED_HEADER_PREFIX = [\r
  0x11,0x46,0x79,0x74,0x6f,0x74,0x72,0x6f,0x6e,0x20,0x50,0x72,0x6f,0x74,0x6f,0x63,\r
  0x6f,0x6c,0x01,0x00,0x00,0x00   // bytes 0..21 static\r
];\r
function encodeUTF8(str){return new TextEncoder().encode(str);}\r
function formatJsonCRLF(obj){\r
  // CRLF, no trailing CRLF on last line, mirroring the python helper.\r
  return JSON.stringify(obj,null,2).split("\\n").map((l,i,a)=> i<a.length-1? l+"\\r\\n" : l).join("");\r
}\r
// Build dynamic header suiting both small and large FYT files.\r
// Robot mapping:\r
//   T = (24 + jsonLen) + 104\r
//   header[22] = (T % 128) | 0x80\r
//   x = floor(T/128) - 1\r
//   Emit x as LEB128 (little-endian base-128): bytes 23.. with 0x80 set on all but last\r
function buildHeaderForJsonLength(jsonLen){\r
  const prefix = new Uint8Array(FIXED_HEADER_PREFIX);\r
  const T = (24 + jsonLen) + 104;\r
  const lo = (T % 128) | 0x80;\r
  let x = Math.floor(T / 128) - 1; // non-negative\r
  // LEB128 of x\r
  const hiBytes = [];\r
  do {\r
    let b = x & 0x7F;\r
    x >>>= 7;\r
    if(x > 0) b |= 0x80;\r
    hiBytes.push(b);\r
  } while(x > 0);\r
\r
  const header = new Uint8Array(prefix.length + 1 + hiBytes.length);\r
  header.set(prefix, 0);\r
  header[prefix.length] = lo;\r
  header.set(new Uint8Array(hiBytes), prefix.length + 1);\r
  return header;\r
}\r
function downloadBytes(name, bytes){\r
  const blob=new Blob([bytes],{type:'application/octet-stream'});\r
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href);\r
}\r
function downloadText(name, text, mime='application/json'){\r
  const a=document.createElement('a');\r
  a.href='data:'+mime+';charset=utf-8,'+encodeURIComponent(text);\r
  a.download=name; a.click();\r
}\r
\r
function displayVarToMachine(type, display){return MACHINE_VAR[type][display]||display.replace(/\\s+/g,'');}\r
function buildParts(){const parts=[];groups.forEach(g=>{const tu=TYPE_UNIT[g.type];const machineVars=(g.vars||[]).map(v=>displayVarToMachine(g.type,v));\r
  const fixedPhases = (g.phases||[]).map(p=>{\r
    if(!p||!p.type) return p;\r
    if(p.type==='ramp'){\r
      const {start,end,duration,step}=p;\r
      return {type:'ramp',duration:normalizeDurationStr(duration||'01:00:00'),step:normalizeDurationStr(step||RAMP_STEP),start:start,end:end};\r
    } else if(p.type==='cloud' || p.type==='clouds'){\r
      // Force type 'clouds' and key order, fixed step and drop coeff\r
      const duration = normalizeDurationStr(p.duration||'01:00:00');\r
      const step = normalizeDurationStr(p.step||RAMP_STEP);\r
      return {\r
        type:'clouds',\r
        duration:duration,\r
        step:step,\r
        amplitude:p.amplitude,\r
        offset:p.offset,\r
        cloud_density:p.cloud_density,\r
        cloud_position:p.cloud_position,\r
        cloud_duration_mean:p.cloud_duration_mean,\r
        cloud_duration_var:p.cloud_duration_var,\r
        fluctuation_mean_ratio: (Math.round((p.fluctuation_mean_ratio)*100)/100),\r
        fluctuation_var:p.fluctuation_var,\r
        cloud_drop_coeff: (Math.round((p.cloud_drop_coeff)*100)/100)\r
      };\r
    } else if(p.type==='sin'){\r
      const duration = normalizeDurationStr(p.duration||'01:00:00');\r
      const step = normalizeDurationStr(p.step||RAMP_STEP);\r
      return {\r
        type:'sin',\r
        duration:duration,\r
        step:step,\r
        min:p.min,\r
        max:p.max,\r
        period: normalizeDurationStr(p.period||'01:00:00'),\r
        phaseOffset: normalizeDurationStr(p.phaseOffset||'00:00:00')\r
      };\r
    }\r
    return p;\r
  });\r
  parts.push({"group-name":g.name,type:tu.type,"union-tag":"fytotron",unit:tu.unit,vars:machineVars,phases:fixedPhases});});return parts;}\r
function buildProtocolJson(){\r
  const desc=$('#desc').value||"";\r
  let logicVal=$('#logic').value.trim(); if(logicVal==='- not set -') logicVal='';\r
  if(logicVal!=='' && !isHHMMSSClock(logicVal)){alert('Logic start time must be HH:MM:SS or left blank'); return null;}\r
  const repRaw=$('#repeat').value.trim(); let repeat=2147483647;\r
  if(repRaw && repRaw!=='Infinitely times'){ const n=parseInt(repRaw,10); if(!Number.isNaN(n)&&n>0) repeat=n; }\r
  return {description:desc,repeat:repeat,logic:logicVal,sections:[{parts:buildParts()}]};\r
}\r
\r
function encodeULEB128(n){\r
  const out=[];\r
  do {\r
    let byte = n & 0x7F;\r
    n >>>= 7;\r
    if(n !== 0) byte |= 0x80;\r
    out.push(byte);\r
  } while(n !== 0);\r
  return new Uint8Array(out);\r
}\r
function decodeULEB128(u8, offset){\r
  let result = 0, shift = 0, pos = offset;\r
  while(true){\r
    const byte = u8[pos++];\r
    result |= (byte & 0x7F) << shift;\r
    if((byte & 0x80) === 0) break;\r
    shift += 7;\r
  }\r
  return { value: result, next: pos };\r
}\r
\r
function buildFytBinary(data){\r
  // JSON (description must be empty inside the JSON)\r
  const jsonCRLF = formatJsonCRLF({\r
    description:"",\r
    repeat:data.repeat,\r
    logic:data.logic,\r
    sections:data.sections\r
  });\r
  const jsonBytes = encodeUTF8(jsonCRLF);\r
\r
  // Trailer = [ULEB128(descLen)] + [desc bytes]\r
  const descBytes = encodeUTF8(data.description || "");\r
  const lenBytes = encodeULEB128(descBytes.length);\r
  const trailer  = new Uint8Array(lenBytes.length + descBytes.length);\r
  trailer.set(lenBytes, 0);\r
  trailer.set(descBytes, lenBytes.length);\r
\r
  // Dynamic header must be computed from JSON length only (not trailer)\r
  const header = buildHeaderForJsonLength(jsonBytes.length);\r
\r
  // Final file = header + JSON + trailer (we still write the trailer bytes)\r
  const totalLen = header.length + jsonBytes.length + trailer.length;\r
  const out = new Uint8Array(totalLen);\r
  out.set(header, 0);\r
  out.set(jsonBytes, header.length);\r
  out.set(trailer, header.length + jsonBytes.length);\r
  return out;\r
}\r

// ===== LOAD FYT =====\r
function bytesToString(u8){ return new TextDecoder().decode(u8); }\r
function stringToBytes(s){ return new TextEncoder().encode(s); }\r
\r
function parseFytBytes(u8){\r
  if(u8.length < 24) throw new Error('File too small to be a FYT.');\r
\r
  // (optional) prefix & header check — keep as-is\r
  for(let i=0;i<22;i++){\r
    if(u8[i] !== FIXED_HEADER_PREFIX[i]){ console.warn('Header prefix mismatch at', i); break; }\r
  }\r
  // Determine dynamic header length by reading header[22] and LEB128 at 23..\r
  const lo = u8[22];\r
  let idx = 23;\r
  // Read until a byte without continuation bit\r
  while(idx < u8.length){\r
    const b = u8[idx++];\r
    if((b & 0x80) === 0) break;\r
  }\r
  const headerLen = idx; // JSON starts here\r
\r
  // Body bytes start after dynamic header\r
  const body = u8.subarray(headerLen);\r
\r
  // Find last '}' byte (0x7d) to delimit JSON\r
  let jsonEnd = -1;\r
  for(let i=body.length-1;i>=0;i--){ if(body[i]===0x7d){ jsonEnd = i; break; } }\r
  if(jsonEnd === -1) throw new Error('Could not locate JSON body inside FYT.');\r
\r
  // Decode JSON (normalize CRLF -> LF for JS parser)\r
  const jsonText = new TextDecoder().decode(body.subarray(0, jsonEnd+1)).replace(/\\r\\n/g, '\\n');\r
  let data;\r
  try{ data = JSON.parse(jsonText); }\r
  catch(e){ console.error('JSON parse error:', e, jsonText); throw new Error('Invalid JSON inside FYT.'); }\r
\r
  // Trailer: ULEB128 length + description bytes\r
  const trailer = body.subarray(jsonEnd+1);\r
  let desc = "";\r
  if(trailer.length){\r
    const { value: dlen, next: afterLen } = decodeULEB128(trailer, 0);\r
    const end = afterLen + dlen;\r
    if(end > trailer.length) throw new Error('Corrupted FYT trailer length.');\r
    desc = new TextDecoder().decode(trailer.subarray(afterLen, end));\r
  }\r
\r
  data.description = desc;\r
  return data;\r
}\r
\r
\r
function machineToDisplayType(machineType){\r
  for(const disp in TYPE_UNIT){\r
    if(TYPE_UNIT[disp].type === machineType) return disp;\r
  }\r
  return null;\r
}\r
function invertMachineVarMap(){\r
  const inv = {};\r
  for(const disp in MACHINE_VAR){\r
    const perType = MACHINE_VAR[disp];\r
    inv[disp] = {};\r
    for(const k in perType){\r
      inv[disp][perType[k]] = k; // machine -> display\r
    }\r
  }\r
  return inv;\r
}\r
const INV_MACHINE_VAR = invertMachineVarMap();\r
\r
function buildGroupsFromLoaded(data){\r
  const parts = (data.sections && data.sections[0] && data.sections[0].parts) ? data.sections[0].parts : [];\r
  const newGroups = [];\r
  const assigned = {}; TAB_ORDER.forEach(t=>assigned[t]=new Set());\r
\r
  parts.forEach(part=>{\r
    const dispType = machineToDisplayType(part.type) || part.type;\r
    const name = part["group-name"] || dispType;\r
    const varsMachine = part.vars || [];\r
    const dispVars = varsMachine.map(mv => (INV_MACHINE_VAR[dispType] && INV_MACHINE_VAR[dispType][mv]) ? INV_MACHINE_VAR[dispType][mv] : mv);\r
    dispVars.forEach(v => assigned[dispType]?.add(v));\r
    varsMachine.forEach(mv => assigned[dispType]?.add(mv));  // use MACHINE names here\r
\r
\r
    const rawPhases = part.phases || [];\r
    const phases = rawPhases.map(p=>{\r
      if(!p || !p.type) return p;\r
      if(p.type === 'clouds'){ // normalize to 'cloud' internally\r
        return {\r
          type:'cloud',\r
          duration: normalizeDurationStr(p.duration||'01:00:00'),\r
          step: normalizeDurationStr(p.step||RAMP_STEP),\r
          amplitude: p.amplitude,\r
          offset: p.offset,\r
          cloud_density: p.cloud_density,\r
          cloud_position: p.cloud_position,\r
          cloud_duration_mean: p.cloud_duration_mean,\r
          cloud_duration_var: p.cloud_duration_var,\r
          fluctuation_mean_ratio: (Math.round((p.fluctuation_mean_ratio)*100)/100),\r
          fluctuation_var: p.fluctuation_var,\r
          cloud_drop_coeff: (Math.round((p.cloud_drop_coeff)*100)/100)\r
        };\r
      } else if(p.type === 'ramp'){\r
        return {\r
          type:'ramp',\r
          start:p.start, end:p.end,\r
          duration: normalizeDurationStr(p.duration||'01:00:00'),\r
          step: normalizeDurationStr(p.step||RAMP_STEP)\r
        };\r
      } else if(p.type === 'sin'){\r
        return {\r
          type:'sin',\r
          duration: normalizeDurationStr(p.duration||'01:00:00'),\r
          step: normalizeDurationStr(p.step||RAMP_STEP),\r
          min:p.min, max:p.max,\r
          period: normalizeDurationStr(p.period||'01:00:00'),\r
          phaseOffset: normalizeDurationStr(p.phaseOffset||'00:00:00')\r
        };\r
      } else if(p.type === 'const'){\r
        return { type:'const', value:p.value, duration: normalizeDurationStr(p.duration||'01:00:00') };\r
      }\r
      return p;\r
    });\r
\r
    newGroups.push({ id:crypto.randomUUID(), type:dispType, name, vars:dispVars, phases });\r
  });\r
\r
  // Build unassigned pool for each type — auto-detect INVENTORY namespace (display vs machine)\r
  const newUnassigned = {};\r
  TAB_ORDER.forEach(t=>{\r
    const all = (INVENTORY[t] || []).slice();          // may be display or machine names\r
    const mvMap = MACHINE_VAR[t] || {};                // display -> machine\r
    const dispSet = new Set(Object.keys(mvMap));       // display namespace\r
    const machSet = new Set(Object.values(mvMap));     // machine namespace\r
\r
    // Heuristic: if every INVENTORY entry is a known machine var (or at least some are and none are display),\r
    // treat INVENTORY as machine namespace; otherwise as display.\r
    const inventoryLooksMachine =\r
      all.length > 0 && (all.every(v => machSet.has(v)) || (!all.some(v => dispSet.has(v)) && all.some(v => machSet.has(v))));\r
\r
    const usedDisp = assigned[t] ? Array.from(assigned[t]) : [];  // we collected DISPLAY names earlier\r
    const used = inventoryLooksMachine ? usedDisp.map(d => mvMap[d] || d) : usedDisp;\r
\r
    newUnassigned[t] = all.filter(v => !used.includes(v));\r
  });\r
\r
\r
  return { groups:newGroups, unassigned:newUnassigned };\r
}\r

      (function validateProfileMatch(){\r

            expectedUnion[typeName] = new Set(Object.values(mvMap));\r
          });\r
          // Accumulate got union per display type (ignoring group names/order)\r
          const gotUnion = {};\r
          TAB_ORDER.forEach(t=> gotUnion[t]=new Set());\r
          parts.forEach(part=>{\r
            const dispType = machineToDisplayType(part.type) || part.type;\r
            const vs = part.vars || [];\r
            if(!(dispType in gotUnion)) gotUnion[dispType]=new Set();\r
            vs.forEach(v=> gotUnion[dispType].add(v));\r
          });\r
          // Compare sets for each known type\r
          TAB_ORDER.forEach(typeName=>{\r
            const exp = expectedUnion[typeName] || new Set();\r
            const got = gotUnion[typeName] || new Set();\r
            // check all expected present\r
            exp.forEach(v=>{ if(!got.has(v)) throw new Error(\`Missing variable "\${v}" for type "\${typeName}".\`); });\r
            // and no extras beyond expected\r
            got.forEach(v=>{ if(!exp.has(v)) throw new Error(\`Unexpected variable "\${v}" for type "\${typeName}".\`); });\r
          });\r
        }catch(e){\r
          alert('This FYT does not match the currently selected profile (union-of-vars check). ' + e.message);\r
          throw e;\r
        }\r
      })();\r
\r
      // Populate top-level properties\r
      protocol = { description:data.description||"", repeat:data.repeat||2147483647, logic:data.logic||"", sections:data.sections||[{parts:[]}] };\r
      // Fill UI fields\r

\r
      // Build groups & unassigned\r
      const rebuilt = buildGroupsFromLoaded(protocol);\r
      groups = rebuilt.groups;\r
      unassigned = rebuilt.unassigned;\r
