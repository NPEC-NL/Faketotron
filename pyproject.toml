[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "npec-faketron-cities"
version = "0.1.0"
description = "Utilities for inspecting and merging the Alan_Cities spectral dataset."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pandas>=2.2",
    "scipy",
]

[project.scripts]
cities-data = "Cities.Cities:main"

[tool.setuptools.packages.find]
include = ["Cities"]
