[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "npec-faketron-cities"
version = "0.1.0"
description = "Utilities for inspecting and merging the Alan_Cities spectral dataset."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "matplotlib>=3.10.8",
    "netcdf4>=1.7.4",
    "openpyxl>=3.1.5",
    "pandas>=2.2",
    "scipy",
    "xarray>=2026.2.0",
]

[project.scripts]
cities-data = "Cities.Cities:main"

[tool.setuptools.packages.find]
include = ["Cities"]
